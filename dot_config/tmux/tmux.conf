# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-sidebar'

# Settings
setw -g mode-keys vi

# Window title (shown in terminal titlebar)
set -g set-titles on
set -g set-titles-string "#S:#W"

# Prefix key: Ctrl+b → Ctrl+a (easier to reach, screen convention)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse support (resize, select, scroll)
set -g mouse on

# display-panes timeout (5s to pick a pane number with prefix+q)
set -g display-panes-time 5000

# Start window/pane index at 1 (matches keyboard layout)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# True Color (24bit) support for Neovim etc.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Cursor style passthrough (blink, shape changes from Neovim)
set -as terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# Undercurl support (wavy underlines in Neovim diagnostics)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Transparent background (pass through Ghostty's background-opacity)
set -g window-style 'bg=default'
set -g window-active-style 'bg=default'

# Split panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# vim-tmux-navigator (Alt-hjkl) — seamless nav between Neovim splits and tmux panes
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n M-h if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind-key -n M-j if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind-key -n M-k if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind-key -n M-l if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'
bind-key -T copy-mode-vi M-h select-pane -L
bind-key -T copy-mode-vi M-j select-pane -D
bind-key -T copy-mode-vi M-k select-pane -U
bind-key -T copy-mode-vi M-l select-pane -R

# workmux dashboard
bind C-s display-popup -h 80% -w 80% -E "workmux dashboard"

# workmux navigation
bind l run-shell "workmux last-done"
bind Tab run-shell "workmux last-agent"

set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'

set -g @resurrect-processes 'vim nvim man less more tail top htop'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-save 'S'

# Init TMUX Plugin Manager
run '~/.tmux/plugins/tpm/tpm'

# Pane border
set -g pane-border-indicators off
set -g pane-border-lines single
set -g pane-border-status top
