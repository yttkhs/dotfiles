merge_strategy: merge
worktree_naming: basename
nerdfont: true
agent: claude

files:
  symlink:
    - .claude/settings.local.json

status_icons:
  working: "󰚩"
  waiting: "󰆄"
  done: "󰄬"

panes:
  - command: nvim     # left: nvim (40%)
  - command: <agent>  # middle: Claude Code (30%, focused)
    split: horizontal
    percentage: 60
    focus: true
  - command: clear    # right: empty shell (30%)
    split: horizontal
    percentage: 50

auto_name:
  model: "gemini-2.5-flash-lite"
  background: true
  system_prompt: |
    Generate a concise git branch name based on the task description.

    Rules:
    - Use kebab-case (lowercase with hyphens)
    - Keep it short: 1-3 words, max 4 if necessary
    - Focus on the core task/feature, not implementation details
    - No prefixes like feat/, fix/, chore/